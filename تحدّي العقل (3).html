<title>تحدّي العقل</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Lalezar&family=Readex+Pro:wght@400;600;700&display=swap">
<style>
/* Layout: one column. HUD (hearts + score) and a progress track on top, one round per screen, 3D "key" buttons.
   Each of the 10 categories has its own hue (--cc) used for tag, ring timer, lit memory cells and result bars. */
:root{
  --bg:#f0eff8; --dot:#d9d7ec; --surface:#ffffff; --fg:#1b1a33; --muted:#625f80; --line:#d8d6ea;
  --accent:#4b3fd6; --accent-fg:#ffffff;
  --good:#16794a; --good-bg:#def3e8; --bad:#c0392b; --bad-bg:#fbe4e0; --warn:#b45309;
  --c-series:#2563eb; --c-logic:#7c3aed; --c-odd:#ea580c; --c-words:#db2777; --c-math:#15803d; --c-memory:#0d9488;
  --c-shapes:#0891b2; --c-count:#a16207; --c-scramble:#65a30d; --c-recall:#4f46e5;
  --display:"Lalezar","Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;
  --head:"Readex Pro","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13112b; --dot:#201d42; --surface:#1d1a3d; --fg:#ecebfa; --muted:#a3a0c6; --line:#322e5f;
    --accent:#9b8cff; --accent-fg:#14102f;
    --good:#64d9a0; --good-bg:#10362a; --bad:#ff8f84; --bad-bg:#3d1b24; --warn:#f5b85c;
    --c-series:#6ea0ff; --c-logic:#b18bff; --c-odd:#ff9a5c; --c-words:#ff7ab8; --c-math:#5fd68a; --c-memory:#4fd8c8;
    --c-shapes:#4ec5e0; --c-count:#f2c14e; --c-scramble:#a3d94c; --c-recall:#8b93ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13112b; --dot:#201d42; --surface:#1d1a3d; --fg:#ecebfa; --muted:#a3a0c6; --line:#322e5f;
  --accent:#9b8cff; --accent-fg:#14102f;
  --good:#64d9a0; --good-bg:#10362a; --bad:#ff8f84; --bad-bg:#3d1b24; --warn:#f5b85c;
  --c-series:#6ea0ff; --c-logic:#b18bff; --c-odd:#ff9a5c; --c-words:#ff7ab8; --c-math:#5fd68a; --c-memory:#4fd8c8;
  --c-shapes:#4ec5e0; --c-count:#f2c14e; --c-scramble:#a3d94c; --c-recall:#8b93ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.2px, transparent 1.2px);
  background-size:20px 20px;
  color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.6;
  padding-block:18px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
#app{max-width:580px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
svg.ic{width:1.25em; height:1.25em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none}

.cat-series{--cc:var(--c-series)} .cat-logic{--cc:var(--c-logic)} .cat-odd{--cc:var(--c-odd)}
.cat-words{--cc:var(--c-words)} .cat-math{--cc:var(--c-math)} .cat-memory{--cc:var(--c-memory)}
.cat-shapes{--cc:var(--c-shapes)} .cat-count{--cc:var(--c-count)} .cat-scramble{--cc:var(--c-scramble)} .cat-recall{--cc:var(--c-recall)}

/* HUD */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px}
.brand{font-family:var(--display); font-size:1.6rem; line-height:1; color:var(--accent)}
.hud{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end}
.hearts{display:flex; gap:3px; color:var(--bad)}
.hearts svg{width:20px; height:20px}
.hearts .full{fill:currentColor; stroke:currentColor}
.hearts .gone{fill:none; stroke:var(--line); stroke-width:2}
.pill{background:var(--surface); border:2px solid var(--line); border-radius:999px; padding:2px 12px; font-family:var(--head); font-weight:600; font-size:.92rem; font-variant-numeric:tabular-nums; display:flex; gap:6px; align-items:center}
.pill small{color:var(--muted); font-weight:400; font-size:.76rem}
.pill.fire{color:var(--warn); border-color:var(--warn)}

.track{display:flex; gap:4px}
.track i{flex:1; height:8px; border-radius:4px; background:var(--line)}
.track i.ok{background:var(--good)} .track i.bad{background:var(--bad)}
.track i.skip{background:var(--muted); opacity:.5} .track i.now{background:var(--accent)}

.card{background:var(--surface); border:2px solid var(--line); box-shadow:0 5px 0 var(--line); border-radius:20px; padding:22px 18px; display:flex; flex-direction:column; gap:18px}

/* Start screen */
.hero h1{font-family:var(--display); font-weight:400; font-size:clamp(3rem,16vw,4.6rem); line-height:1; margin:0}
.hero h1 em{font-style:normal; color:var(--accent)}
.hero .lead{margin:0; color:var(--muted); max-width:44ch}
.sub{font-family:var(--head); font-weight:600; font-size:.88rem; color:var(--muted); margin:0 0 8px}
.seg{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{background:var(--bg); border:2px solid var(--line); box-shadow:0 3px 0 var(--line); border-radius:14px; padding:10px 6px; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0}
.seg button b{font-family:var(--head); font-size:1.02rem}
.seg button span{font-size:.74rem; color:var(--muted); text-align:center}
.seg button[aria-checked="true"]{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 13%, var(--surface))}
.seg button[aria-checked="true"] b{color:var(--accent)}
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px}
.tile{border:2px solid var(--line); border-radius:14px; padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; min-width:0}
.tile .gl{width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:color-mix(in srgb, var(--cc) 16%, var(--surface)); color:var(--cc)}
.tile .gl svg{width:21px; height:21px}
.tile b{font-size:.8rem; font-weight:600; line-height:1.3}
.rules{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px; font-size:.93rem}
.rules li{display:flex; gap:10px; align-items:flex-start}
.rules li::before{content:""; flex:none; width:8px; height:8px; margin-top:.6em; border-radius:50%; background:var(--accent)}
.best{color:var(--muted); font-size:.9rem}
.best b{color:var(--fg); font-family:var(--head)}

.btn{background:var(--accent); color:var(--accent-fg); border:0; border-radius:14px; padding:13px 22px; font-family:var(--head); font-weight:600; font-size:1.02rem; box-shadow:0 4px 0 color-mix(in srgb, var(--accent) 55%, #000); transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px); box-shadow:0 0 0 transparent}
.btn.wide{width:100%; padding:15px 22px; font-size:1.1rem}
.btn.ghost{background:var(--surface); color:var(--fg); border:2px solid var(--line); box-shadow:0 4px 0 var(--line)}

/* Question screen */
.qhead{display:flex; align-items:center; justify-content:space-between; gap:12px}
.tag{display:inline-flex; align-items:center; gap:8px; background:color-mix(in srgb, var(--cc) 15%, var(--surface)); color:var(--cc); border-radius:999px; padding:5px 14px 5px 12px; font-family:var(--head); font-weight:600; font-size:.88rem}
.tag small{color:var(--muted); font-weight:400}
.ring{position:relative; width:52px; height:52px; display:grid; place-items:center; flex:none; font-family:var(--head); font-weight:600; font-variant-numeric:tabular-nums}
.ring svg{position:absolute; inset:0; width:100%; height:100%}
.ring circle{fill:none; stroke-width:4.5}
.ring .rt{stroke:var(--line)}
.ring .rf{stroke:var(--cc); stroke-linecap:round; stroke-dasharray:113.1; stroke-dashoffset:0}
.ring.low .rf{stroke:var(--bad)} .ring.low span{color:var(--bad)}
.q{font-family:var(--head); font-weight:600; font-size:1.2rem; line-height:1.6; margin:0; text-wrap:balance}
.expr{font-family:var(--head); font-weight:700; font-size:1.7rem; text-align:center; font-variant-numeric:tabular-nums; padding:6px 0; overflow-wrap:anywhere}
.seq{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; direction:ltr}
.seq span{min-width:54px; padding:10px 8px; text-align:center; border:2px solid var(--line); border-radius:14px; font-family:var(--head); font-weight:700; font-size:1.25rem; font-variant-numeric:tabular-nums; background:var(--bg)}
.seq span.qm, .pseq span.qm{border-style:dashed; color:var(--cc); border-color:var(--cc); background:transparent}
.pseq{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; direction:ltr}
.pseq span{width:62px; height:62px; border:2px solid var(--line); border-radius:14px; display:grid; place-items:center; background:var(--bg); font-family:var(--head); font-weight:700; font-size:1.3rem}
.letters{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; direction:rtl}
.letters span{min-width:46px; height:54px; padding:0 6px; border:2px solid var(--line); border-radius:12px; display:grid; place-items:center; background:var(--bg); font-family:var(--head); font-weight:700; font-size:1.55rem}
.scene svg{display:block; width:100%; height:auto; border:2px solid var(--line); border-radius:14px; background:var(--bg)}
.recbar{height:6px; background:var(--cc); border-radius:3px; transform-origin:right}
@keyframes shrink{from{transform:scaleX(1)} to{transform:scaleX(0)}}

.opts{display:grid; gap:10px}
.opts.vis{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex; align-items:center; gap:12px; text-align:start; background:var(--surface); border:2px solid var(--line); box-shadow:0 4px 0 var(--line); border-radius:14px; padding:12px 14px; min-width:0; transition:transform .08s, box-shadow .08s, border-color .12s}
.opt .k{flex:none; width:30px; height:30px; border-radius:10px; background:color-mix(in srgb, var(--cc) 15%, var(--surface)); color:var(--cc); display:grid; place-items:center; font-family:var(--head); font-weight:700; font-size:.88rem}
.opt .t{min-width:0; overflow-wrap:anywhere; font-weight:500}
.opts.vis .t{flex:1; display:flex; justify-content:center}
.opt:hover:not(:disabled){border-color:var(--cc)}
.opt:active:not(:disabled){transform:translateY(4px); box-shadow:0 0 0 transparent}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-bg); border-color:var(--good); box-shadow:0 4px 0 var(--good)}
.opt.wrong{background:var(--bad-bg); border-color:var(--bad); box-shadow:0 4px 0 var(--bad)}
.opt.out{opacity:.3; box-shadow:none}

.lifes{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.ll{display:flex; align-items:center; gap:6px; background:var(--bg); border:2px solid var(--line); border-radius:999px; padding:6px 14px; font-size:.86rem; font-weight:600}
.ll b{font-family:var(--head); color:var(--accent)}
.ll:disabled{opacity:.4; cursor:default}
.ll:hover:not(:disabled){border-color:var(--accent)}
.ll .ic{width:1.1em; height:1.1em}

.fb{border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:10px}
.fb.ok{background:var(--good-bg)} .fb.no{background:var(--bad-bg)}
.fb strong{font-family:var(--head); font-weight:600}
.fb.ok strong{color:var(--good)} .fb.no strong{color:var(--bad)}
.fb p{margin:0; font-size:.92rem}
.fb .btn{align-self:stretch}

.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:min(100%,310px); margin:0 auto}
.cell{aspect-ratio:1; border:2px solid var(--line); box-shadow:0 4px 0 var(--line); background:var(--bg); border-radius:16px; transition:background .1s, border-color .1s, transform .1s}
.cell.lit{background:var(--cc); border-color:var(--cc); box-shadow:0 4px 0 color-mix(in srgb, var(--cc) 60%, #000); transform:translateY(-2px)}
.status{text-align:center; color:var(--muted); font-size:.95rem; min-height:1.6em}

/* Result */
.rank{font-family:var(--display); font-weight:400; font-size:2.6rem; line-height:1.1; margin:0; color:var(--accent)}
.stars{display:flex; gap:4px; color:var(--warn)}
.stars svg{width:28px; height:28px; fill:currentColor; stroke:currentColor; stroke-width:1.5; stroke-linejoin:round}
.stars .off{fill:none; stroke:var(--line); stroke-width:2}
.score{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.score .n{font-family:var(--display); font-size:3.6rem; line-height:1; font-variant-numeric:tabular-nums}
.score .l{color:var(--muted)}
.facts{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.facts div{border:2px solid var(--line); border-radius:14px; padding:8px; text-align:center}
.facts b{display:block; font-family:var(--head); font-size:1.2rem; font-variant-numeric:tabular-nums}
.facts span{font-size:.76rem; color:var(--muted)}
.bars{display:flex; flex-direction:column; gap:12px}
.bar .row{display:flex; justify-content:space-between; font-size:.9rem; margin-bottom:4px}
.bar .row span:first-child{display:flex; align-items:center; gap:6px; color:var(--cc); font-weight:600}
.bar .row span:last-child{font-variant-numeric:tabular-nums; color:var(--muted)}
.bar .rail{height:10px; background:var(--line); border-radius:5px; overflow:hidden}
.bar .rail i{display:block; height:100%; background:var(--cc); border-radius:5px}
.actions{display:flex; gap:10px; flex-wrap:wrap}
.actions .btn{flex:1 1 140px}
.share{width:100%; font:inherit; font-size:.85rem; padding:8px 10px; border:2px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg)}

@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>

<div id="app" dir="rtl" lang="ar">
  <div class="top">

  </div>

  <main id="stage"></main>
</div>

<script>

    { name:'متوسط', time:20, lives:3, mult:1.5, ll:{f:1,t:1,s:1}, mem:[4,6], flash:550, hint:'20 ثانية · 3 قلوب · ×1.5' },

  var stage = document.getElementById('stage');

  var diff = 1, mode = 0, S, cur, timerId, t0, lim, token = 0;

  function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=rnd(0,i), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
  function mk(cat,text,opts,correct,why,extra){
    var o = shuffle(opts), q = { cat:cat, text:text, options:o, answer:o.indexOf(correct), why:why };
    if(extra){ for(var k in extra) q[k]=extra[k]; }

  }

  /* ---------- No-repeat picker: remembers what you've already seen ---------- */
  var memSeen = {};
  function seenGet(k){ try{ return JSON.parse(localStorage.getItem('mg3-'+k)||'[]'); }catch(e){ return memSeen[k]||[]; } }

  function pick(k, arr, n){
    var seen = seenGet(k).filter(function(i){ return i<arr.length; });

    if(out.length<n){
      var rest = []; arr.forEach(function(_,i){ if(out.indexOf(i)<0) rest.push(i); });
      out = out.concat(shuffle(rest).slice(0,n-out.length)); seen = out.slice();
    } else { seen = seen.concat(out); }

    return out.map(function(i){ return arr[i]; });
  }

  /* ---------- Question banks ---------- */
  var LOGIC = [

      function norm(a){ return ((a%360)+360)%360; }
      ans={s:'tri',c:c,r:norm(start+step*4)};
      opts=[ans,{s:'tri',c:c,r:norm(ans.r+step)},{s:'tri',c:c,r:norm(ans.r-step)},{s:'tri',c:c,r:norm(ans.r+2*step)}];
      rule='المثلث يدور '+step+' درجة في كل خطوة.';
    } else if(t==='cnt'){
      var a0=rnd(1,3), df=rnd(1,2);
      for(i=0;i<4;i++) shown.push({s:'dots',c:c,n:a0+df*i});
      var an=a0+df*4; ans={s:'dots',c:c,n:an};
      opts=[ans,{s:'dots',c:c,n:an-1},{s:'dots',c:c,n:an-2},{s:'dots',c:c,n:an>=10?an-3:an+1}];
      rule='عدد النقاط يزيد '+df+' في كل خطوة.';
    } else if(t==='combo'){
      var two=shuffle(SH).slice(0,2);
      for(i=0;i<5;i++) shown.push({s:two[i%2],c:c,f:(i%3)!==0});
      ans={s:two[5%2],c:c,f:(5%3)!==0};
      opts=[ans,{s:ans.s,c:c,f:!ans.f},{s:two[0]===ans.s?two[1]:two[0],c:c,f:ans.f},{s:two[0]===ans.s?two[1]:two[0],c:c,f:!ans.f}];
      rule='الشكل يتبدل كل خطوة، والتعبئة تتكرر كل ثلاث خطوات.';
    } else {
      var b0=rnd(3,5), seqn=[b0,b0+3,b0+2,b0+5,b0+4];
      seqn.forEach(function(n){ shown.push({s:'dots',c:c,n:n}); });
      var an2=b0+7; ans={s:'dots',c:c,n:an2};
      opts=[ans,{s:'dots',c:c,n:an2-1},{s:'dots',c:c,n:an2-2},{s:'dots',c:c,n:an2-3}];
      rule='نضيف 3 ثم نطرح 1 بالتناوب.';
    }
    return mk('shapes','أي شكل يكمل النمط؟',opts.map(function(o){ return shp(o,52); }),shp(ans,52),rule,
      {pseq:shown.map(function(o){ return shp(o,46); }), vis:true});
  }

  /* quick counting */
  function genCount(d){
    var SH=['circle','square','tri','hex'], NAME={circle:'الدوائر',square:'المربعات',tri:'المثلثات',hex:'السداسيات'};
    var N=[14,18,22][d], T=rnd(2,7), shape=SH[rnd(0,3)], col=rnd(0,3), colorQ=d>=1, items=[], i;
    for(i=0;i<T;i++) items.push({s:shape, c: colorQ?col:rnd(0,3)});
    while(items.length<N){
      var it={s:SH[rnd(0,3)], c:rnd(0,3)};
      if(colorQ ? (it.s===shape && it.c===col) : (it.s===shape)) continue;
      items.push(it);
    }
    items = shuffle(items);
    var cells = shuffle(Array.apply(null,{length:28}).map(function(_,k){ return k; })).slice(0,N), svg='';
    items.forEach(function(it,k){
      var cx = cells[k]%7, cy = Math.floor(cells[k]/7);
      svg += '<svg x="'+(cx*40+5+rnd(-2,2))+'" y="'+(cy*40+5+rnd(-2,2))+'" width="30" height="30" viewBox="0 0 40 40">'+shpBody(it)+'</svg>';
    });
    var scene='<svg viewBox="0 0 280 160" aria-hidden="true">'+svg+'</svg>';
    var text = colorQ ? 'كم عدد '+NAME[shape]+' '+COLNAME[col]+' في الصورة؟' : 'كم عدد '+NAME[shape]+' في الصورة؟';
    return mk('count',text,numOptions(T),String(T),'العدد الصحيح هو '+T+'.',{scene:scene});
  }

  /* scramble */
  function genScramble(){
    var w = pick('scr',SCR,1)[0], L = w.split(''), s, tries=0;
    do{ s=shuffle(L); tries++; }while(s.join('')===w && tries<20);
    var same = shuffle(SCR.filter(function(x){ return x!==w && Math.abs(x.length-w.length)<=1; })).slice(0,3);
    if(same.length<3){ same = same.concat(shuffle(SCR.filter(function(x){ return x!==w && same.indexOf(x)<0; })).slice(0,3-same.length)); }
    return mk('scramble','رتّب الحروف لتكوّن كلمة صحيحة:',[w].concat(same),w,'الكلمة الصحيحة هي «'+w+'».',{letters:s});
  }

  /* digit recall */
  function genRecall(d){
    var L=[4,5,6][d]+rnd(0,1), s=String(rnd(1,9)), i;
    for(i=1;i<L;i++) s+=String(rnd(0,9));
    var set=[s], guard=0;
    function change(){ var a=s.split(''), k=rnd(0,L-1); a[k]=String((+a[k]+rnd(1,8))%10); return a.join(''); }
    function swap(){ var a=s.split(''), k=rnd(0,L-2), t=a[k]; a[k]=a[k+1]; a[k+1]=t; return a.join(''); }
    while(set.length<4 && guard<60){ guard++; var v = (guard%2===0) ? swap() : change(); if(set.indexOf(v)<0) set.push(v); }
    return mk('recall','ما الرقم الذي ظهر قبل لحظات؟',set,s,'الرقم الصحيح هو '+s+'.',{recall:s, showMs:1500+L*450});
  }

  function makeRound(cat,de,n){
    if(cat==='series') return genSeries(de,n);
    if(cat==='math') return genMath(de);
    if(cat==='shapes') return genShapes(de);
    if(cat==='count') return genCount(de);
    if(cat==='scramble') return genScramble();
    if(cat==='recall') return genRecall(de);
    if(cat==='memory') return { cat:'memory', len:CFG[de].mem[0]+1 };
    if(cat==='logic'){ var l=pick('logic',LOGIC,1)[0]; return mk('logic',l[0],l[1],l[2],l[3]); }
    if(cat==='odd'){ var o=pick('odd',ODD,1)[0]; return mk('odd','أي عنصر لا ينتمي إلى المجموعة؟',o[0],o[1],o[2]); }
    var w=pick('words',WORDS,1)[0];
    return mk('words', w[4]?'أكمل العلاقة:':w[0], w[1], w[2], w[3], w[4]?{big:w[0],dir:'rtl'}:null);
  }

  function effD(){ return mode ? Math.min(2, diff+Math.floor((S?S.i:0)/12)) : diff; }
  function buildPlan(de){
    var extra = shuffle(['series','logic','odd','words','math','shapes','count','scramble','recall']).slice(0,2);
    var cats = ORDER.concat(extra), cnt={}, items=[];
    cats.forEach(function(c){ cnt[c]=cnt[c]||0; items.push(makeRound(c,de,cnt[c]++)); });
    for(var tries=0;tries<300;tries++){
      var p=shuffle(items), ok=p[0].cat!=='memory', i;
      for(i=1;i<p.length && ok;i++){ if(p[i].cat===p[i-1].cat) ok=false; }
      if(ok) return p;
    }
    return items;
  }

  /* ---------- HUD ---------- */
  function paintHud(){
    var D=CFG[diff], h='', i;
    for(i=0;i<D.lives;i++){
      h += '<svg viewBox="0 0 24 24" class="'+(i<S.lives?'full':'gone')+'" aria-hidden="true"><path d="'+HEART+'"/></svg>';
    }
    hud.innerHTML =
      '<div class="hearts" role="img" aria-label="القلوب المتبقية '+S.lives+'">'+h+'</div>'+
      (S.streak>=2 ? '<div class="pill fire"><small>تتابع</small>×'+S.streak+'</div>' : '')+
      (mode && S.started ? '<div class="pill"><small>الجولة</small>'+(S.i+1)+'</div>' : '')+
      '<div class="pill"><small>النقاط</small>'+S.score+'</div>';
    var t='';
    if(!mode){
      for(var j=0;j<CLASSIC;j++){
        var r=S.results[j], c = r===true?'ok': r===false?'bad': r==='skip'?'skip': (S.started && j===S.i ? 'now':'');
        t += '<i class="'+c+'"></i>';
      }
    }
    track.innerHTML = t;
  }

  function bestKey(){ return 'mindgame3-best-'+mode+'-'+diff; }
  function bestGet(){ try{ return parseInt(localStorage.getItem(bestKey()),10)||0; }catch(e){ return 0; } }
  function bestSet(v){ try{ localStorage.setItem(bestKey(), String(v)); }catch(e){} }

  function freshState(){
    var D=CFG[diff];
    S = { i:0, score:0, streak:0, bestStreak:0, correct:0, played:0, results:[], plan:[], cats:{}, lives:D.lives, ll:{f:D.ll.f,t:D.ll.t,s:D.ll.s}, started:false, bonusHeart:false };
  }

  /* ---------- Start ---------- */
  function bestLine(){
    var b=bestGet();
    return b ? 'أفضل نتيجة لك هنا: <b>'+b+'</b> نقطة' : 'لم تلعب هذا الوضع بعد.';
  }
  function showStart(){
    token++; stopTimer(); freshState(); paintHud();
    var modes = ['كلاسيكي|12 جولة متنوعة','ماراثون|بلا نهاية حتى تنفد القلوب'].map(function(m,i){
      var p=m.split('|'); return '<button type="button" role="radio" aria-checked="'+(i===mode)+'" data-m="'+i+'"><b>'+p[0]+'</b><span>'+p[1]+'</span></button>';
    }).join('');
    var segs = CFG.map(function(c,i){
      return '<button type="button" role="radio" aria-checked="'+(i===diff)+'" data-d="'+i+'"><b>'+c.name+'</b><span>'+c.hint+'</span></button>';
    }).join('');
    var tiles = ORDER.map(function(k){
      return '<div class="tile cat-'+k+'"><span class="gl">'+ic(k)+'</span><b>'+LABEL[k]+'</b></div>';
    }).join('');
    var fixed = LOGIC.length+ODD.length+WORDS.length+SCR.length;
    stage.innerHTML =
      '<section class="card hero">'+
        '<h1>تحدّي <em>العقل</em></h1>'+
        '<p class="lead">عشر ألعاب ذكاء تتبدل في كل جولة. فيها '+fixed+' سؤالًا جاهزًا، إضافة إلى أسئلة تُولَّد عشوائيًا، وما رأيته مؤخرًا لا يعود إليك سريعًا.</p>'+
        '<div><p class="sub">اختر الوضع</p><div class="seg two" role="radiogroup" aria-label="وضع اللعب" id="sm">'+modes+'</div></div>'+

        '<div class="tiles">'+tiles+'</div>'+
        '<div><p class="sub">قوانين اللعبة</p><ul class="rules">'+
          '<li>كل إجابة خاطئة أو انتهاء للوقت يخسّرك قلبًا. إذا نفدت القلوب تنتهي اللعبة.</li>'+
          '<li>كلما أجبت أسرع كسبت نقاطًا أكثر، والإجابات الصحيحة المتتالية تضيف مكافأة تتابع.</li>'+
          '<li>لديك وسائل مساعدة: حذف خيارين، أو 10 ثوانٍ إضافية، أو تخطي السؤال بلا خسارة. عددها يختلف حسب المستوى.</li>'+
          '<li>في الماراثون تتصاعد الصعوبة كل 12 جولة، وكل 5 إجابات صحيحة متتالية تعيد إليك قلبًا.</li>'+
          '<li>مستوى الصعوبة يضرب نقاطك: ×1 أو ×1.5 أو ×2.</li>'+
        '</ul></div>'+
        '<div class="best" id="bst">'+bestLine()+'</div>'+
        '<button type="button" class="btn wide" id="go">ابدأ التحدّي</button>'+
      '</section>';
    function bind(id, key, set){
      stage.querySelectorAll('#'+id+' button').forEach(function(btn){
        btn.onclick=function(){
          set(+btn.dataset[key]); freshState(); paintHud();
          stage.querySelectorAll('#'+id+' button').forEach(function(x){ x.setAttribute('aria-checked', String(x===btn)); });
          document.getElementById('bst').innerHTML = bestLine();
        };
      });
    }
    bind('sm','m',function(v){ mode=v; });
    bind('sd','d',function(v){ diff=v; });
    document.getElementById('go').onclick = startGame;
  }

  function startGame(){
    freshState(); S.started=true; S.i=0; S.plan=buildPlan(effD()); nextRound();
  }

  function nextRound(){
    token++;
    if((!mode && S.i>=CLASSIC) || S.lives<=0){ return showResult(); }
    if(S.i>=S.plan.length){ S.plan = S.plan.concat(buildPlan(effD())); }
    cur = S.plan[S.i];
    paintHud();
    if(cur.cat==='memory') renderMemory(); else renderQuestion();
  }

  /* ---------- Question round ---------- */
  function ringHtml(){
    return '<div class="ring" id="ring"><svg viewBox="0 0 44 44" aria-hidden="true"><circle class="rt" cx="22" cy="22" r="18"/><circle class="rf" id="rf" cx="22" cy="22" r="18" transform="rotate(-90 22 22)"/></svg><span id="tn"></span></div>';
  }
  function tagHtml(q){
    return '<span class="tag">'+ic(q.cat)+LABEL[q.cat]+(mode?'':' <small>'+(S.i+1)+'/'+CLASSIC+'</small>')+'</span>';
  }
  function lifelinesHtml(){
    var D=CFG[diff];
    if(!D.ll.f && !D.ll.t && !D.ll.s) return '';
    return '<div class="lifes" id="lifes">'+
      '<button type="button" class="ll" data-k="f"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h8M5 18h14"/></svg>حذف خيارين <b></b></button>'+
      '<button type="button" class="ll" data-k="t"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 3h6"/></svg>+10 ثوانٍ <b></b></button>'+
      '<button type="button" class="ll" data-k="s"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6M11 6l-6 6 6 6"/></svg>تخطّي <b></b></button>'+
    '</div>';
  }
  function paintLifelines(){
    ['f','t','s'].forEach(function(k){
      var b = stage.querySelector('.ll[data-k="'+k+'"]'); if(!b) return;
      b.querySelector('b').textContent = '×'+S.ll[k];
      b.disabled = S.ll[k]<=0 || !timerId;
    });
  }

  function renderRecallShow(q){
    var my=token;
    stage.innerHTML =
      '<section class="card cat-recall">'+
        '<div class="qhead">'+tagHtml(q)+'</div>'+
        '<h2 class="q">احفظ هذا الرقم جيدًا</h2>'+
        '<div class="expr" dir="ltr" style="font-size:2.6rem;letter-spacing:.18em">'+q.recall+'</div>'+
        '<div class="recbar" style="animation:shrink '+q.showMs+'ms linear forwards"></div>'+
      '</section>';
    sleep(q.showMs).then(function(){ if(my!==token) return; q.shown=true; renderQuestion(); });
  }

  function renderQuestion(){
    var q = cur, extra = '';
    if(q.recall && !q.shown) return renderRecallShow(q);
    if(q.seq) extra = '<div class="seq">'+q.seq.map(function(n){ return '<span>'+n+'</span>'; }).join('')+'<span class="qm">؟</span></div>';
    else if(q.pseq) extra = '<div class="pseq">'+q.pseq.map(function(h){ return '<span>'+h+'</span>'; }).join('')+'<span class="qm">؟</span></div>';
    else if(q.scene) extra = '<div class="scene">'+q.scene+'</div>';
    else if(q.letters) extra = '<div class="letters">'+q.letters.map(function(l){ return '<span>'+l+'</span>'; }).join('')+'</div>';
    else if(q.big) extra = '<div class="expr" dir="'+q.dir+'">'+q.big+'</div>';
    stage.innerHTML =
      '<section class="card cat-'+q.cat+'">'+
        '<div class="qhead">'+tagHtml(q)+ringHtml()+'</div>'+
        '<h2 class="q">'+q.text+'</h2>'+ extra +
        '<div class="opts'+(q.vis?' vis':'')+'">'+ q.options.map(function(o,i){
          return '<button type="button" class="opt" data-i="'+i+'"><span class="k">'+LETTERS[i]+'</span><span class="t">'+o+'</span></button>';
        }).join('') +'</div>'+
        lifelinesHtml()+
        '<div id="fb" aria-live="polite"></div>'+
      '</section>';
    stage.querySelectorAll('.opt').forEach(function(b){ b.onclick = function(){ answer(+b.dataset.i); }; });
    stage.querySelectorAll('.ll').forEach(function(b){ b.onclick = function(){ useLifeline(b.dataset.k); }; });
    startTimer(); paintLifelines();
  }

  function leftNow(){ return Math.max(0, lim-(Date.now()-t0)/1000); }
  function startTimer(){
    stopTimer(); t0=Date.now(); lim=CFG[diff].time;
    var rf=document.getElementById('rf'), tn=document.getElementById('tn'), ring=document.getElementById('ring');
    function tick(){
      var left=leftNow();
      rf.style.strokeDashoffset = String(113.1*(1-left/lim));
      tn.textContent = Math.ceil(left);
      if(left<=5) ring.classList.add('low'); else ring.classList.remove('low');
      if(left<=0) answer(-1);
    }
    tick(); timerId=setInterval(tick,100);
  }
  function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

  function useLifeline(k){
    if(!timerId || S.ll[k]<=0) return;
    if(k==='f'){
      var wrong=[]; cur.options.forEach(function(o,i){ if(i!==cur.answer) wrong.push(i); });
      shuffle(wrong).slice(0,2).forEach(function(i){
        var b=stage.querySelector('.opt[data-i="'+i+'"]'); b.disabled=true; b.classList.add('out');
      });
    } else if(k==='t'){
      lim += 10;
    } else {
      stopTimer(); S.ll.s--; S.results[S.i]='skip'; S.i++; return nextRound();
    }
    S.ll[k]--; paintLifelines();
  }

  function streakBonus(){ return S.streak>=1 ? Math.min(S.streak,4)*10 : 0; }

  function record(cat, ok, pts){
    S.results[S.i] = ok; S.played++;
    S.cats[cat] = S.cats[cat] || {ok:0,n:0};
    S.cats[cat].n++;
    if(ok){
      S.cats[cat].ok++; S.correct++; S.streak++;
      if(S.streak>S.bestStreak) S.bestStreak=S.streak;
      if(mode && S.streak%5===0 && S.lives<CFG[diff].lives){ S.lives++; S.bonusHeart=true; }
    } else { S.streak=0; S.lives--; }
    S.score += pts;
    paintHud();
  }

  function feedback(ok, pts, why){
    var over = S.lives<=0, last = !mode && S.i===CLASSIC-1, fb=document.getElementById('fb');
    var head = ok ? 'إجابة صحيحة · +'+pts + (S.streak>=3?' · تتابع ×'+S.streak:'') + (S.bonusHeart?' · عاد إليك قلب':'') : (over?'انتهت القلوب':'إجابة خاطئة');
    S.bonusHeart=false;
    fb.innerHTML =
      '<div class="fb '+(ok?'ok':'no')+'">'+
        '<strong>'+head+'</strong>'+
        (why?'<p>'+why+'</p>':'')+
        '<button type="button" class="btn" id="nx">'+((over||last)?'عرض النتيجة':'الجولة التالية')+'</button>'+
      '</div>';
    var nx=document.getElementById('nx');
    nx.onclick=function(){ if(over||last){ showResult(); } else { S.i++; nextRound(); } };
    nx.focus();
  }

  function answer(idx){
    if(!timerId) return;
    var left=leftNow(), frac=left/lim; stopTimer();
    var ok = idx===cur.answer, pts=0;
    if(ok) pts = Math.round((100+Math.round(frac*50)+streakBonus())*CFG[diff].mult);
    stage.querySelectorAll('.opt').forEach(function(b,i){
      b.disabled=true;
      if(i===cur.answer) b.classList.add('right'); else if(i===idx) b.classList.add('wrong');
    });
    var l=document.getElementById('lifes'); if(l) l.hidden=true;
    record(cur.cat, ok, pts);
    var pre = (cur.cat==='series'||cur.cat==='shapes') ? 'القاعدة: ' : '';
    feedback(ok, pts, (idx===-1?'انتهى الوقت. ':'')+pre+cur.why);
  }

  /* ---------- Memory round ---------- */
  function renderMemory(){
    var q=cur, my=token, pos=0, locked=true, seq=[], last=-1, i, c, D=CFG[diff];
    for(i=0;i<q.len;i++){ do{ c=rnd(0,8); }while(c===last); seq.push(c); last=c; }
    var cells=''; for(i=0;i<9;i++) cells+='<button type="button" class="cell" data-c="'+i+'" aria-label="خانة '+(i+1)+'"></button>';
    stage.innerHTML =
      '<section class="card cat-memory">'+
        '<div class="qhead">'+tagHtml(q)+'<span class="tag" style="--cc:var(--muted)">'+q.len+' خطوات</span></div>'+
        '<h2 class="q">احفظ ترتيب الخانات المضيئة ثم أعده بالترتيب نفسه.</h2>'+
        '<div class="grid">'+cells+'</div>'+
        '<div class="status" id="ms" aria-live="polite">استعد...</div>'+
        '<div id="fb" aria-live="polite"></div>'+
      '</section>';
    var cs=stage.querySelectorAll('.cell'), ms=document.getElementById('ms');
    function flash(k,t){ cs[k].classList.add('lit'); return sleep(t).then(function(){ cs[k].classList.remove('lit'); }); }
    function finish(ok){
      locked=true;
      var pts = ok ? Math.round((100+q.len*10+streakBonus())*D.mult) : 0;
      ms.textContent = ok ? 'ممتاز، ذاكرتك قوية.' : 'الترتيب الصحيح كان: '+seq.map(function(n){ return n+1; }).join(' ، ');
      record('memory', ok, pts);
      feedback(ok, pts, ok?'':'ترقيم الخانات من اليمين إلى اليسار ثم إلى الأسفل.');
    }
    cs.forEach(function(b){
      b.onclick=function(){
        if(locked||my!==token) return;
        var k=+b.dataset.c; flash(k,160);
        if(k!==seq[pos]) return finish(false);
        pos++; ms.textContent=pos+' من '+q.len;
        if(pos===q.len) finish(true);
      };
    });
    var p=sleep(800);
    seq.forEach(function(k){ p=p.then(function(){ if(my!==token) return; return flash(k,D.flash); }).then(function(){ return sleep(200); }); });
    p.then(function(){ if(my!==token) return; locked=false; ms.textContent='دورك الآن'; });
    ms.textContent='شاهد الترتيب';
  }

  /* ---------- Result ---------- */
  function titleFor(n){
    if(mode){
      if(n>=35) return 'أسطورة';
      if(n>=25) return 'عبقري';
      if(n>=15) return 'ذكي جدًا';
      if(n>=8) return 'فوق المتوسط';
      return 'بداية جيدة';
    }
    if(n>=11) return 'عبقري';
    if(n>=9) return 'ذكي جدًا';
    if(n>=7) return 'فوق المتوسط';
    if(n>=5) return 'متوسط وفيك خير';
    return 'تحتاج إلى تدريب';
  }
  function showResult(){
    token++; stopTimer(); S.started=false; paintHud();
    var prev=bestGet(), isNew=S.score>prev;
    if(isNew) bestSet(S.score);
    var stars = mode ? Math.min(5,Math.floor(S.correct/6)) : Math.round(S.correct/CLASSIC*5), sh='';
    for(var s=0;s<5;s++) sh+='<svg viewBox="0 0 24 24" class="'+(s<stars?'':'off')+'" aria-hidden="true"><path d="'+STAR+'"/></svg>';
    var bars=ORDER.filter(function(k){ return S.cats[k]; }).map(function(k){
      var c=S.cats[k], w=Math.round(c.ok/c.n*100);
      return '<div class="bar cat-'+k+'"><div class="row"><span>'+ic(k)+LABEL[k]+'</span><span>'+c.ok+' من '+c.n+'</span></div><div class="rail"><i style="width:'+w+'%"></i></div></div>';
    }).join('');
    var gameOver = S.lives<=0 && (mode || S.played<CLASSIC);
    var third = mode ? '<div><b>'+S.played+'</b><span>جولات لُعبت</span></div>' : '<div><b>'+S.lives+'</b><span>قلوب متبقية</span></div>';
    stage.innerHTML =
      '<section class="card">'+
        '<p class="rank">'+titleFor(S.correct)+'</p>'+
        '<div class="stars" role="img" aria-label="'+stars+' من 5 نجوم">'+sh+'</div>'+
        '<div class="score"><span class="n">'+S.score+'</span><span class="l">نقطة · '+(mode?'ماراثون':'كلاسيكي')+' · '+CFG[diff].name+(gameOver?' · انتهت القلوب':'')+'</span></div>'+
        (isNew?'<div class="best"><b>رقم قياسي جديد في هذا الوضع.</b></div>':'<div class="best">أفضل نتيجة لك هنا: <b>'+prev+'</b> نقطة</div>')+
        '<div class="facts"><div><b>'+S.correct+'</b><span>إجابات صحيحة</span></div><div><b>'+S.bestStreak+'</b><span>أفضل تتابع</span></div>'+third+'</div>'+
        '<div class="bars">'+bars+'</div>'+
        '<div id="shr"></div>'+
        '<div class="actions"><button type="button" class="btn" id="again">العب مرة أخرى</button><button type="button" class="btn ghost" id="copy">انسخ نتيجتك</button></div>'+
      '</section>';
    document.getElementById('again').onclick=showStart;
    document.getElementById('copy').onclick=function(){
      var t='جبت '+S.score+' نقطة في تحدّي العقل ('+(mode?'ماراثون':'كلاسيكي')+' · '+CFG[diff].name+') وتقييمي: '+titleFor(S.correct)+'. تقدر تكسر رقمي؟';
      var btn=this, box=document.getElementById('shr');
      function manual(){ box.innerHTML='<input class="share" id="shi" readonly value="'+t+'">'; var i=document.getElementById('shi'); i.focus(); i.select(); }
      try{ navigator.clipboard.writeText(t).then(function(){ btn.textContent='تم النسخ'; }, manual); }catch(e){ manual(); }
    };
  }

  showStart();
})();
</script>

</body></html>
